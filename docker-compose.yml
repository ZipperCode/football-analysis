services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: football_analysis
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_analysis"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://football:football@postgres:5432/football_analysis
      FOOTBALL_CONFIG: config/default.yaml
    ports:
      - "8000:8000"

volumes:
  postgres-data:
