tier_policies:
  elite_club:
    label: live_scoring
  secondary_professional:
    label: secondary_live_small_stake
    min_data_quality: 0.75
    min_value_score: 68.0
    max_risk_score: 45.0
    min_confidence: 0.58
    max_stake_units: 0.5
    min_bookmakers: 2
  major_tournament:
    label: tournament_live_small_stake
    min_data_quality: 0.78
    min_value_score: 70.0
    max_risk_score: 42.0
    min_confidence: 0.60
    max_stake_units: 0.5
    min_bookmakers: 2

backtest:
  data_dir: data/historical
  default_league: E0
  default_season: "2526"

live_trading:
  enabled: true
  min_bookmakers: 2
  max_odds_age_minutes: 90
  max_execution_odds_slippage: 0.01
  min_data_quality: 0.82
  min_value_score: 68.0
  max_risk_score: 42.0
  min_confidence: 0.58
  min_edge: 0.025
  min_long_horizon_bets: 150
  min_long_horizon_roi: 0.08
  min_holdout_bets: 80
  min_holdout_roi: 0.08
  min_holdout_positive_rate: 0.60
  min_average_clv: 0.01
  max_worst_season_roi: -0.35
  max_recent_consecutive_losses: 3
  rolling_window_settled_bets: 8
  min_rolling_settled_bets: 5
  max_rolling_loss_units: 2.0
  min_rolling_roi: -0.25
  review_min_settled_bets: 6
  review_min_roi: 0.0
  review_min_average_clv: 0.0
  review_pause_roi: -0.15
  max_stake_units_per_pick: 0.5
  max_daily_stake_units: 1.2

