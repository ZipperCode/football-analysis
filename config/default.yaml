app:
  name: football-analysis
  timezone: Asia/Shanghai
  fixture_mode: true
  daily_pick_limit: 5
  markets:
    - 1x2
    - asian_handicap
    - over_under
  risk_notice: "仅供赛前分析，不保证收益；请自行承担风险，并严格控制最大仓位。"

storage:
  database_url: sqlite:///./data/football_analysis.db

ingestion:
  request_timeout_seconds: 12.0
  max_retries: 2
  default_lookahead_days: 2
  default_lookback_days: 0
  store_raw_payloads: true
  qqsd_live_context_enabled: true
  qqsd_odds_timeline_enabled: true
  qqsd_timeline_company_name: Pinnacle

cache:
  enabled: true
  default_ttl_seconds: 10800
  odds_ttl_seconds: 10800
  fixtures_ttl_seconds: 21600
  historical_ttl_seconds: 604800

quota:
  providers:
    api_football:
      requests_per_day: 100
    odds_api_io:
      requests_per_hour: 100
    football_data_org:
      requests_per_minute: 10
    thesportsdb:
      requests_per_minute: 30
    football_data_uk:
      requests_per_day: 200
    leisu:
