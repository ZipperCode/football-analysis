  enabled: false
  method: power
  sharp_bookmaker_priority:
    - Pinnacle
    - Betfair Exchange
    - Smarkets
  min_anchor_outcomes: 2

data_sources:
  api_football:
    name: API-FOOTBALL/API-SPORTS
    enabled: true
    base_url: https://v3.football.api-sports.io
    api_key_env: API_FOOTBALL_KEY
    free_tier_note: "100 requests/day on the free plan according to PLAN.md."
  odds_api_io:
    name: Odds-API.io
    enabled: true
    base_url: https://api.odds-api.io/v3
    api_key_env: ODDS_API_IO_KEY
    bookmakers:
      - Bet365
      - 1xbet
    free_tier_note: "100 requests/hour on the free plan according to PLAN.md."
  football_data_org:
    name: football-data.org
    enabled: true
    base_url: https://api.football-data.org/v4
    api_key_env: FOOTBALL_DATA_ORG_TOKEN
  thesportsdb:
    name: TheSportsDB
    enabled: true
    base_url: https://www.thesportsdb.com/api/v1/json
    api_key_env: THESPORTSDB_API_KEY
  football_data_uk:
    name: football-data.co.uk
    enabled: true
    base_url: https://www.football-data.co.uk
  the_odds_api:
    name: The Odds API
    enabled: true
    base_url: https://api.the-odds-api.com/v4
    api_key_env: THE_ODDS_API_KEY
    regions:
      - uk
      - eu
    markets:
      - h2h
      - spreads
      - totals
    sport_keys:
      EPL: soccer_epl
      LALIGA: soccer_spain_la_liga
      SERIE_A: soccer_italy_serie_a
      BUNDESLIGA: soccer_germany_bundesliga
      LIGUE_1: soccer_france_ligue_one
      MLS: soccer_usa_mls
      ARG_PRIMERA: soccer_argentina_primera_division
      A_LEAGUE: soccer_australia_aleague
      K_LEAGUE_1: soccer_korea_kleague1
      J1: soccer_japan_j_league
      LIGA_MX: soccer_mexico_ligamx
      WORLD_CUP: soccer_fifa_world_cup
    free_tier_note: "Historical odds are paid snapshots; use only after subscribing to a plan that covers required soccer leagues and markets."
  sportmonks:
    name: Sportmonks Football API
    enabled: true
    base_url: https://api.sportmonks.com/v3/football
    api_key_env: SPORTMONKS_TOKEN
    free_tier_note: "Premium Odds Feed is a paid add-on; historical odds are available only in the provider's supported window."
  exa:
    name: Exa Search API
    enabled: true
    base_url: https://api.exa.ai
    api_key_env: EXA_API_KEY
    free_tier_note: "Used for pre-match research evidence. Store the key in EXA_API_KEY; do not commit secrets."
  firecrawl:
    name: Firecrawl Search API
    enabled: true
    base_url: https://api.firecrawl.dev
    api_key_env: FIRECRAWL_API_KEY
    free_tier_note: "Fallback provider for pre-match research evidence. Store the key in FIRECRAWL_API_KEY; do not commit secrets."
  tavily:
    name: Tavily Search API
    enabled: true
    base_url: https://api.tavily.com
    api_key_env: TAVILY_API_KEY
    free_tier_note: "Supplemental search provider for pre-match research evidence. Store the key in TAVILY_API_KEY; do not commit secrets."
  qqsd:
    name: 球球是道 API
    enabled: true
    base_url: https://i.qqshidao.com
    api_key_env: QQSD_C_CK
    free_tier_note: "补充赛事/比分/赔率缺口；QQSD_C_CK is the c_ck token. Some endpoints may allow empty c_ck only when QQSD_ALLOW_EMPTY_C_CK=1 is explicitly set."
  leisu:
    name: Leisu Sports experimental reverse-engineered read-only source
    enabled: false
    base_url: https://app-gateway.kantai8.com
    free_tier_note: "Experimental only; keep disabled until sync-config and read-only football probes pass."
  dongqiudi:
    name: Dongqiudi public read-only football source
    enabled: true
    base_url: https://api.dongqiudi.com
    free_tier_note: "Public unsigned endpoints; default evidence source for schedule, lineup, match analysis, situation, and team news."

execution_brokers:
  betfair_exchange:
    name: Betfair Exchange API-NG
    enabled: false
    provider: betfair
    base_url: https://api.betfair.com/exchange/betting/json-rpc/v1
    credential_envs:
      - BETFAIR_APP_KEY
      - BETFAIR_SESSION_TOKEN
    required_match_external_ids:
      - betfair_market_id
    required_selection_external_ids:
      - betfair_selection_id
    stake_currency: GBP
    stake_currency_per_unit:
    official_url: https://docs.developer.betfair.com/
    notes: "Requires an approved Betfair developer account, application key, session token, marketId, selectionId, and a configured stake_currency_per_unit before order placement can be automated."

